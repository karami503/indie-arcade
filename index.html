<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://*.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>Indie Arcade</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%237cf3ff' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="#/">INDIE<span>ARCADE</span></a>
    <button class="chip" id="profileBtn" type="button" aria-haspopup="dialog">
      <span class="lv" id="lvBadge">Lv 1</span>
      <span id="nickLabel">플레이어</span>
      <span class="cloud" id="cloudDot"></span>
    </button>
  </header>

  <main id="home" class="wrap"></main>

  <main id="play" class="wrap" hidden>
    <div class="play-bar">
      <a class="btn ghost" href="#/">← 목록</a>
      <h2 id="playTitle"></h2>
      <div class="hud"><span id="hud"></span><span class="best" id="best"></span></div>
    </div>
    <div class="stage" id="stage"></div>
    <p class="howto" id="howto"></p>
    <section class="board" id="board" hidden aria-labelledby="boardTitle">
      <h3 id="boardTitle">전체 랭킹 TOP 10</h3>
      <ol id="boardList"></ol>
      <p class="muted small" id="boardNote" role="status"></p>
    </section>
  </main>

  <dialog id="profile" aria-labelledby="profileTitle">
    <div class="dlg">
      <h3 id="profileTitle">프로필</h3>
      <label class="field">닉네임 (랭킹에 표시돼요)
        <input id="nickInput" maxlength="16" autocomplete="nickname">
      </label>
      <p class="muted small" id="cloudInfo" role="status"></p>
      <div class="row end"><button class="btn ghost" id="profileClose" type="button">닫기</button></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
